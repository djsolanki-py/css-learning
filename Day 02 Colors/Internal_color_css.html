<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colors in HTML/CSS</title>

    <!-- Internal CSS -->
    <style>
        body {
            background-color: #8d99f5;
        }

        h1 {
            /*
                RGB
                R = Red
                G = Green
                B = Blue

                Each value ranges from 0 to 255.

                Black  → rgb(0, 0, 0)
                White  → rgb(255, 255, 255)
                Red    → rgb(255, 0, 0)
                Green  → rgb(0, 255, 0)
                Blue   → rgb(0, 0, 255)
            */

            color: rgb(30, 217, 205);

            /*
                Hexadecimal
                #RRGGBB

                #000000 → Black
                #FFFFFF → White
                #FF0000 → Red
                #0000FF → Blue

                Hexadecimal values range from 00 to FF.
            */

            background-color: #4b6042;
        }

        p {
            /*
                HSL
                H = Hue
                S = Saturation
                L = Lightness

                Hue ranges from 0° to 360°.

                0°   → Red
                120° → Green
                240° → Blue
            */

            color: hsla(240, 50%, 25%, 0.5);
        }
    </style>
</head>

<body>

    <h1>Colors in HTML/CSS</h1>

    <p>
        This example demonstrates different ways to define colors
        using CSS.
    </p>

</body>

</html>
